<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .container{
            display: flex;
            gap: 5px;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        .container2{
            display: flex;
            gap: 5px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .items{
            border: 1px solid rgb(17, 9, 238);
            padding: 5px;
            background-color: rgb(255, 207, 214);
        } 

        .item{
            border: 1px solid red;
            padding: 5px;
            background-color: rgb(202, 240, 253);
           /*border-radius: 100%;*/
          
          
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">Rin</div>
        <div class="item">Tin</div>
        <div class="item">Min</div>
        <div class="item">Sin</div>
        <div class="item">Lin</div>
        <div class="item">Win</div>
</div><br><br>

<div class="container2">
    <div class="items">1</div>
    <div class="items">2</div>
    <div class="items">3</div>
    <div class="items">4</div>
    <div class="items">5</div>
    <div class="items">6</div>
    <div class="items">7</div>
    <div class="items">8</div>
    <div class="items">9</div>
    <div class="items">10</div>
    <div class="items">11</div>
    <div class="items">12</div>
</div>
</body>
</html>
