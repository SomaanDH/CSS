<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Displays</title>
    <style>
        #SuMan,.Somaan,.Rin{
            text-align: center;
            display:block;
            
        }
        .Somaan{
            border: 2px solid rgb(31, 19, 167);
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            text-decoration:underline;
            background-color: rgb(255, 213, 232);
        }
        #SuMan{
            border: 2px solid rgb(12, 58, 209);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: rgb(0, 0, 0);

        }
        .Rin{
            border: 2px dashed rgb(11, 35, 114);
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: blue;
            background-color: rgb(246, 130, 186);
        }
        .img{
            width:100px;
            border: 2px solid rgb(2, 2, 81);
            border-radius: 50%;
        }
        .container{
            display: block;
            text-align: center;
            background-color: rgb(171, 244, 244);
            border-radius: 5px;
        }
        .ptop{
            background-color: rgb(3, 158, 160);
            color: white;
            text-align: right;
            border: 1px solid black;
            border-radius: 5px;
        }
        .items{
            display: flex;
            gap:20px;
        }
        .item{
           width:110px;
           height:110px;
           object-fit: cover;
            border-radius: 15px;
        }
        .research{
            background-color: #d2e6f5;
            padding: 18px 20px 22px;
            width:100%;
            box-sizing: border-box;
            border-radius: 15px;
        }
        
        .item img{
            width:120px;
            height:120px;
            object-fit: cover;
            border: #111;white-space: nowrap;
        }


    </style>
</head>
