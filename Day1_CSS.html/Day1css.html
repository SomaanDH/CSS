<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Day8</title>
</head>

<body>
    <h1>Student Information</h1>
    <form action="#" method="get">
        <label for="Fname">First_Name</label>
        <input type="text" name="FirstName" id="Fname" placeholder="Enter your FirstName" required><br><br>
        <label for="Lname">Last_Name</label>
        <input type="text" name="LastName" id="Lname" placeholder="Enter your LastName" required><br><br>
         <label for="email">Email</label>
        <input type="email" name="email" id="" placeholder="Enter your Email" required><br><br>
        
        <label for="tel">Phone No.</label>
        <input type="tel" name="tel" id="" placeholder="Enter your Phone No." required><br><br>

        <label for="dob">Date Of Birth</label>
        <input type="date" name="dob" id="" required><br><br>
       <fieldset>
            <legend>Choose your Gender</legend>
        <lable for="M">Male</lable>
        <input type="radio" name="gender" id="M" required><br>
        <lable for="F">Female</lable>
        <input type="radio" name="gender" id="F" required><br>
        </fieldset><br>

        <label for="command">Enter your Feedback</label><br>
        <textarea></textarea><br><br>

        <input type="submit" value="Submit">
        
    </form>
</body>

</html>
